name: Publicar PWA en GitHub Pages

# Publica la app (versión demo, sin backend) como sitio estático en
# https://<usuario>.github.io/mente-sana/  para compartir el enlace.
#
# Requiere que el repositorio sea PÚBLICO (GitHub Pages gratis no funciona en
# repos privados) o que la cuenta tenga un plan con Pages en repos privados.

on:
  push:
    branches: ["claude/cool-brown-g0rns0"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compilar (base = /mente-sana/)
        run: npm run build
        env:
          VITE_BASE: /mente-sana/
          # Si defines estas Variables del repositorio (Settings -> Secrets and
          # variables -> Actions -> Variables), la app publicada usará Supabase
          # real. Si quedan vacías, la app sigue en modo demo.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
